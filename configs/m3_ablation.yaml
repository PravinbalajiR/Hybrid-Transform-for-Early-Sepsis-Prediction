# M3-mask — Ablation: Values + Mask only (no time-delta)
# Tests whether missingness patterns alone improve over M2
experiment_name: m3_mask_only
model: m3_mask_only
epochs: 30
batch_size: 32
learning_rate: 0.0001
weight_decay: 0.0001
patience: 10
hidden_dim: 64
num_heads: 4
layers: 3
dropout: 0.1
ablation_mode: mask_only
